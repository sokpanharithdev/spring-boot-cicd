name: Build and deploy Spring boot application

on:
  push:
    branches:
      - develop

jobs:
  build-deploy:
    name: Build and Deploy Spring boot
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Java JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: 17

      # Step 3: Start Unit Tests
      - name: Unit Tests
        run: mvn -B test --file pom.xml

      # Step 4: Build the application
      - name: Build the application
        run: |
          mvn clean
          mvn -B package --file pom.xml

      # Step 5: Login to GitHub container registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      # Step 6: Prepare image tag
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: v1.0.0

      # Step 7: Build docker image and Push to GitHub container registry
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}